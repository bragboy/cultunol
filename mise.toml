[tools]
hugo-extended = "0.168.0"

[tasks.dev]
description = "Run the site locally with live reload"
run = "hugo server --bind 127.0.0.1 --port 1313 --disableFastRender --renderToMemory"

[tasks.build]
description = "Build the production site into dist/"
run = "hugo --gc --minify --cleanDestinationDir --destination dist"

[tasks.deploy]
description = "Build for the preview domain and sync to the francium.tech server"
run = """
hugo --gc --minify --cleanDestinationDir --destination dist --baseURL https://cultunol.prueba.top/
if grep -rl livereload dist >/dev/null; then echo 'refusing to deploy: livereload found in dist'; exit 1; fi
rsync -rltz --delete dist/ deploy@francium.tech:/var/www/cultunol/
"""
