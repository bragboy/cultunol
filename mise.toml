[tools]
hugo-extended = "0.168.0"

[tasks.dev]
description = "Run the site locally with live reload"
run = "hugo server --bind 127.0.0.1 --port 1313 --disableFastRender --renderToMemory"

[tasks.build]
description = "Build the production site into dist/"
run = "hugo --gc --minify --cleanDestinationDir --destination dist"
