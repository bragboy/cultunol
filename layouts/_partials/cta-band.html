{{- /* Closing band shared by inner pages. */ -}}
<section class="band" data-reveal>
  <div class="wrap band-inner">
    <div>
      <p class="eyebrow">{{ T "band_kicker" }}</p>
      <h2>{{ T "band_title" }}</h2>
      <p>{{ T "band_text" }}</p>
    </div>
    <div class="band-actions">
      <a class="btn btn-orange" href="{{ "contactar" | relLangURL }}">{{ T "contact" }} {{ partial "icon.html" "arrow" }}</a>
      <a class="btn btn-glass" href="{{ site.Params.subscribe | relLangURL }}">{{ T "newsletter_btn" }}</a>
    </div>
  </div>
</section>
